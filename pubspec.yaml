name: sakinah_wallet
description: "Sharia-compliant personal finance"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.8

  # DI
  get_it: ^9.2.1

  # Local DB
  drift: ^2.33.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.5
  path: ^1.9.1

  # Functional types — replaces dartz (which is unmaintained)
  fpdart: ^1.2.0

  # Routing
  go_router: ^17.2.3

  # Sensitive storage + biometric
  flutter_secure_storage: ^10.1.0
  local_auth: ^3.0.1

  # Charts
  fl_chart: ^1.2.0

  # Utilities
  intl: ^0.20.2
  logger: ^2.7.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # Lint
  flutter_lints: ^6.0.0

  # Testing
  mockito: ^5.6.4   # plan said ^5.6.5 but it pulls analyzer ^13 which conflicts with drift_dev's ^10-12
  bloc_test: ^10.0.0
  alchemist: ^0.14.0

  # Code generation
  build_runner: ^2.15.0
  drift_dev: ^2.33.0
  # freezed: ^3.2.5    # uncomment when first sealed state lands
  # json_serializable: ^6.13.2  # uncomment when first remote DTO lands

flutter:
  uses-material-design: true
